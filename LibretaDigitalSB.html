body {

.editor-wrapper {
  height: 100vh; /* Fills entire viewport height */
  display: flex;
  flex-direction: column;
}

#divEditorQuill {
  display: flex;
  flex-direction: column;
  flex: 1; /* Forces editor to consume all remaining vertical space */
  overflow: hidden; /* Contains the editor structure */
}

/* Internal scrollable area for text */
#divEditorQuill .ql-editor {
  flex: 1;
  overflow-y: auto;
}

/* Toolbar stays static at the top */
#divEditorQuill .ql-toolbar {
  flex-shrink: 0;
}
